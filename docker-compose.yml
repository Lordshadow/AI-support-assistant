version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL with pgvector & pg_trgm (Unified Data + Vector)
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: novaretail-postgres
    restart: always
    environment:
      POSTGRES_DB: novaretail_db
      POSTGRES_USER: novaretail_admin
      POSTGRES_PASSWORD: novaretail_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./support-assistant/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaretail_admin -d novaretail_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Redis (Cache-Aside, Rate Limiting & Burst Queue)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: novaretail-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
