services:
  # -------------------------------------------------------------
  # 1. PostgreSQL with pgvector & pg_trgm (Unified Data + Vector)
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_DB: novaretail_db
      POSTGRES_USER: novaretail_admin
      POSTGRES_PASSWORD: novaretail_secure_pass
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./support-assistant/db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaretail_admin -d novaretail_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Redis (Cache-Aside, Rate Limiting & Burst Protection)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PUBLISHED_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 3. NovaRetail Assistant API Gateway & Frontends
  # -------------------------------------------------------------
  assistant-api:
    build:
      context: ./support-assistant
      dockerfile: Dockerfile
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=novaretail_db
      - POSTGRES_USER=novaretail_admin
      - POSTGRES_PASSWORD=novaretail_secure_pass
      - NOVARETAIL_TENANT_ID=${NOVARETAIL_TENANT_ID:-tenant_novaretail}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_SMALL_MODEL=${GROQ_SMALL_MODEL:-openai/gpt-oss-20b}
      - GROQ_LARGE_MODEL=${GROQ_LARGE_MODEL:-openai/gpt-oss-120b}
      - CATALOG_SOURCE=${CATALOG_SOURCE:-live}
      - APEXSTORE_CATALOG_API_URL=${APEXSTORE_CATALOG_API_URL}
      - APEXSTORE_CATALOG_API_TOKEN=${APEXSTORE_CATALOG_API_TOKEN}
      - APEXSTORE_CATALOG_TIMEOUT_SECONDS=${APEXSTORE_CATALOG_TIMEOUT_SECONDS:-30}
      - APEXSTORE_CATALOG_MAX_ATTEMPTS=${APEXSTORE_CATALOG_MAX_ATTEMPTS:-4}
      - APEXSTORE_CATALOG_REQUESTS_PER_SECOND=${APEXSTORE_CATALOG_REQUESTS_PER_SECOND:-2}
      - APEXSTORE_REFUND_SYNC_URL=${APEXSTORE_REFUND_SYNC_URL:-}
      - APEXSTORE_REFUND_SYNC_SECRET=${APEXSTORE_REFUND_SYNC_SECRET:-}
      - APP_ENV=${APP_ENV:-production}
      - CATALOG_EMBEDDING_MODEL=${CATALOG_EMBEDDING_MODEL:-baai/bge-m3}
      - CATALOG_EMBEDDER_TYPE=${CATALOG_EMBEDDER_TYPE:-local}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY:-}
      - NVIDIA_NIM_BASE_URL=${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - EMBEDDING_TIMEOUT_SECONDS=${EMBEDDING_TIMEOUT_SECONDS:-30}
      - EMBEDDING_MAX_ATTEMPTS=${EMBEDDING_MAX_ATTEMPTS:-3}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-}
      - OPENWA_SHARED_SECRET=${OPENWA_SHARED_SECRET:-}
      - DATABASE_ASYNC_URL=postgresql+asyncpg://novaretail_app:novaretail_app_secret@postgres:5432/novaretail_db
      - DATABASE_SYNC_URL=postgresql+psycopg2://novaretail_app:novaretail_app_secret@postgres:5432/novaretail_db
      - ENABLE_DEPENDENCY_HEALTHCHECKS=true
      - WIDGET_ALLOWED_ORIGINS=${WIDGET_ALLOWED_ORIGINS:-https://shop.novaretail.com,http://localhost:3000,http://127.0.0.1:3000}
      - OTP_DELIVERY_MODE=${OTP_DELIVERY_MODE:-smtp}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
    ports:
      - "${API_PUBLISHED_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ./support-assistant
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://novaretail_admin:novaretail_secure_pass@postgres:5432/novaretail_db
    depends_on:
      postgres:
        condition: service_healthy

  outbox-worker:
    build:
      context: ./support-assistant
      dockerfile: Dockerfile
    command: ["python", "-m", "services.support_desk.outbox_worker"]
    restart: unless-stopped
    environment:
      - DATABASE_ASYNC_URL=postgresql+asyncpg://novaretail_app:novaretail_app_secret@postgres:5432/novaretail_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TENANT_ID=tenant_novaretail
      - OUTBOX_POLL_INTERVAL=2
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p='/tmp/outbox-worker.heartbeat'; assert os.path.exists(p) and time.time()-os.path.getmtime(p)<30"]
      interval: 10s
      timeout: 3s
      retries: 3

  dashboard:
    build:
      context: ./master-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PUBLISHED_PORT:-3001}:80"
    depends_on:
      assistant-api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
